<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой сайт</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f4f7f6;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .floating-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #4f46e5;
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            z-index: 1000;
        }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 300px;
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 10px; right: 10px;
            cursor: pointer;
            font-size: 20px;
            background: none; border: none;
        }
        .input-group { margin-bottom: 15px; }
        .input-group input { width: 100%; padding: 8px; box-sizing: border-box; }
        .submit-btn { width: 100%; padding: 10px; background: #4f46e5; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>Добро пожаловать на мой сайт! 👋</h1>

    <!-- Летающая кнопка -->
    <button class="floating-btn" onclick="document.getElementById('myModal').style.display='flex'">📝 Зарегистрируйтесь</button>

    <!-- Окно регистрации -->
    <div class="modal-overlay" id="myModal" onclick="if(event.target===this) this.style.display='none'">
        <div class="modal-content">
            <button class="close-btn" onclick="document.getElementById('myModal').style.display='none'">&times;</button>
            <h3>Регистрация</h3>
            <form onsubmit="event.preventDefault(); alert('Готово! Демо-регистрация успешна.'); document.getElementById('myModal').style.display='none'">
                <div class="input-group"><input type="text" placeholder="Ваше Имя" required></div>
                <div class="input-group"><input type="email" placeholder="Ваш Email" required></div>
                <button type="submit" class="submit-btn">Отправить</button>
            </form>
        </div>
    </div>

</body>
</html>
